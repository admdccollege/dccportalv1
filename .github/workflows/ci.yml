name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql postgresql-contrib
      - run: sudo systemctl stop postgresql || true
      - run: bash scripts/test-db.sh
  app:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      SUPABASE_SERVICE_ROLE_KEY: placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx next telemetry disable
      - run: npx next typegen || true
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - name: Smoke test the production server
        run: |
          npx next start -p 3100 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3100/manifest.json && break; sleep 1; done
          curl -s http://localhost:3100/login | grep -q 'Damdei Christian College'
          curl -s http://localhost:3100/manifest.json | grep -q '"display": "standalone"'
          curl -s http://localhost:3100/sw.js | grep -q 'attendance-sync'
          curl -s -o /dev/null -w '%{http_code} %{redirect_url}\n' http://localhost:3100/dashboard | grep -q '/login'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3100/api/receipt/x)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3100/api/cron/daily)" = "401"
          curl -s http://localhost:3100/offline | grep -q 'offline'
